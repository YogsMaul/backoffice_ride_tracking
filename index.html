<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ride Tracking Backoffice - Administrative dashboard for real-time ride monitoring, user management, and operational analytics." />
    <meta name="theme-color" content="#0d1326" />
    <link rel="manifest" href="/manifest.json" />
    <meta property="og:title" content="Ride Tracking Backoffice" />
    <meta property="og:description" content="Administrative dashboard for real-time ride monitoring and management" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Overpass:wght@400;500;600;700&family=Overpass+Mono:wght@400;600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Overpass:wght@400;500;600;700&family=Overpass+Mono:wght@400;600&display=swap" rel="stylesheet" /></noscript>
    <title>Ride Tracking Backoffice</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('admin_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored || (prefersDark ? 'dark' : 'light');
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-paper text-ink antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
