<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Stylized map showing a route between three points" fill="none">
  <defs>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Map card / frame -->
  <rect x="40" y="40" width="400" height="280" rx="20" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>

  <!-- Map grid (subtle, R-07: must serve identity) -->
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.7">
    <line x1="40" y1="100" x2="440" y2="100"/>
    <line x1="40" y1="160" x2="440" y2="160"/>
    <line x1="40" y1="220" x2="440" y2="220"/>
    <line x1="40" y1="280" x2="440" y2="280"/>
    <line x1="120" y1="40" x2="120" y2="320"/>
    <line x1="200" y1="40" x2="200" y2="320"/>
    <line x1="280" y1="40" x2="280" y2="320"/>
    <line x1="360" y1="40" x2="360" y2="320"/>
  </g>

  <!-- Faint roads / curves -->
  <path d="M40 240 C 140 200, 220 270, 320 220 S 440 180, 440 180" stroke="#cbd5e1" stroke-width="2" fill="none" stroke-dasharray="2 4" opacity="0.6"/>
  <path d="M80 80 C 180 130, 240 110, 320 150 S 420 200, 440 240" stroke="#cbd5e1" stroke-width="2" fill="none" stroke-dasharray="2 4" opacity="0.5"/>

  <!-- Route (identity motif) -->
  <path d="M110 270 C 160 200, 220 220, 260 170 S 340 110, 380 90"
        stroke="url(#route)" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Start pin -->
  <g transform="translate(110 270)">
    <circle r="9" fill="#2563eb" opacity="0.18"/>
    <circle r="5" fill="#2563eb"/>
  </g>

  <!-- Mid stop -->
  <g transform="translate(260 170)">
    <circle r="6" fill="#7c3aed" opacity="0.18"/>
    <circle r="3.5" fill="#7c3aed"/>
  </g>

  <!-- End pin (with pin shape) -->
  <g transform="translate(380 90)">
    <path d="M0 -22 C 8 -22, 14 -16, 14 -8 C 14 4, 0 18, 0 18 C 0 18, -14 4, -14 -8 C -14 -16, -8 -22, 0 -22 Z"
          fill="#7c3aed" opacity="0.18" transform="scale(1.4)"/>
    <path d="M0 -16 C 5.5 -16, 10 -11.5, 10 -6 C 10 3, 0 12, 0 12 C 0 12, -10 3, -10 -6 C -10 -11.5, -5.5 -16, 0 -16 Z"
          fill="#7c3aed"/>
    <circle cy="-6" r="3.2" fill="#ffffff"/>
  </g>

  <!-- Tiny cluster of riders at start -->
  <g transform="translate(110 270)">
    <circle r="2" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
